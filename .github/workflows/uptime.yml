name: uptime

on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: API health
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://api.pay.bits.co.id/health)
          [ "$code" = "200" ] || { echo "API health gagal: $code"; exit 1; }
      - name: Web landing
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://pay.bits.co.id/)
          [ "$code" = "200" ] || { echo "Landing gagal: $code"; exit 1; }
      - name: Status page
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://pay.bits.co.id/status.html)
          [ "$code" = "200" ] || { echo "Status page gagal: $code"; exit 1; }
