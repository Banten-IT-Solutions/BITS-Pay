name: '🚀 Deploy API'

on:
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  NODE_NO_WARNINGS: 1
  WORKER_NAME: ${{ vars.WORKER_NAME || secrets.WORKER_NAME }}
  API_DOMAIN: ${{ vars.API_DOMAIN || secrets.API_DOMAIN }}
  D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME || secrets.D1_DATABASE_NAME }}
  D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
  API_URL: ${{ vars.API_URL || secrets.API_URL }}
  APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
  FROM_EMAIL: ${{ vars.FROM_EMAIL || secrets.FROM_EMAIL }}
  TRANSACTION_EXPIRE_MINUTES: ${{ vars.TRANSACTION_EXPIRE_MINUTES || secrets.TRANSACTION_EXPIRE_MINUTES }}
  PREMIUM_PRICE_MONTHLY: ${{ vars.PREMIUM_PRICE_MONTHLY || secrets.PREMIUM_PRICE_MONTHLY }}
  PREMIUM_PRICE_YEARLY: ${{ vars.PREMIUM_PRICE_YEARLY || secrets.PREMIUM_PRICE_YEARLY }}
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI || secrets.GOOGLE_REDIRECT_URI }}
  JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN || secrets.JWT_EXPIRES_IN }}
  ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || secrets.ADMIN_EMAILS }}
  OCR_CONFIDENCE_THRESHOLD: ${{ vars.OCR_CONFIDENCE_THRESHOLD || secrets.OCR_CONFIDENCE_THRESHOLD }}
  MAX_UNIQUE_CODE: ${{ vars.MAX_UNIQUE_CODE || secrets.MAX_UNIQUE_CODE }}
  PROOF_RETENTION_DAYS: ${{ vars.PROOF_RETENTION_DAYS || secrets.PROOF_RETENTION_DAYS }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  QRIS_STATIC: ${{ secrets.QRIS_STATIC }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: '☁️ Deploy API Worker'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@v7.0.1

      - name: '📦 Setup pnpm'
        uses: pnpm/action-setup@v4

      - name: '☕ Setup Node'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: '📦 Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: '🔧 Generate Wrangler config'
        working-directory: packages/api
        run: pnpm cf:config

      - name: '🔍 Show resolved deploy targets'
        working-directory: packages/api
        run: |
          set -euo pipefail
          echo "WORKER_NAME      = ${WORKER_NAME:-(default: bits-pay-api)}"
          echo "API_DOMAIN       = ${API_DOMAIN:-(default: api.pay.bits.co.id)}"
          echo "D1_DATABASE_NAME = ${D1_DATABASE_NAME:-(default: bits-pay)}"
          echo "D1_DATABASE_ID   = ${D1_DATABASE_ID:-(default: local)}"
          echo "APP_URL          = ${APP_URL:-(default)}"
          test -n "${JWT_SECRET}" || { echo "✗ JWT_SECRET is empty (GitHub secret wajib diisi)"; exit 1; }
          echo "--- wrangler.jsonc (name + domain + d1) ---"
          grep -E '"name"|"pattern"|"database_name"|"database_id"' wrangler.jsonc || true

      - name: '🏗️ Build shared'
        run: pnpm --filter @bits-pay/shared build

      - name: '🔍 Type check'
        run: pnpm type-check

      - name: '🧪 Run tests'
        run: pnpm test

      - name: '🗄️ Apply D1 migrations'
        working-directory: packages/api
        run: npx wrangler d1 migrations apply "${D1_DATABASE_NAME:-bits-pay}" --remote

      # Sync secrets SEBELUM deploy: worker tanpa JWT_SECRET akan error saat
      # sign/verify token. Sync dulu menutup jendela itu.
      - name: '🔐 Sync secrets'
        working-directory: packages/api
        run: |
          set -euo pipefail
          node -e '
            const fs=require("fs");
            const secrets={};
            for (const k of ["JWT_SECRET","GOOGLE_CLIENT_SECRET","QRIS_STATIC","RESEND_API_KEY"]) {
              if (process.env[k]) secrets[k]=process.env[k];
            }
            if (Object.keys(secrets).length) {
              fs.writeFileSync(".worker-secrets.json", JSON.stringify(secrets));
              console.log("Secrets to sync:", Object.keys(secrets).join(", "));
            } else {
              console.log("No secrets to sync");
            }
          '
          if [ -f .worker-secrets.json ]; then
            trap 'rm -f .worker-secrets.json' EXIT
            npx wrangler secret bulk .worker-secrets.json
          fi

      - name: '🚀 Deploy Worker'
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/api

      - name: '✅ Smoke test'
        run: |
          url="${API_URL:-https://api.pay.bits.co.id}"
          echo "Checking $url/health..."
          for i in 1 2 3 4 5; do
            if curl -fsS "$url/health" | grep -q '"ok"'; then
              echo "✓ Health check passed at $url/health"
              exit 0
            fi
            echo "Retry $i/5..."
            sleep 10
          done
          echo "✗ Smoke test failed at $url/health"
          curl -v "$url/health" || true
          exit 1
