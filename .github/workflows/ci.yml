name: '🧪 CI'

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: '🔍 Lint'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@v7.0.1

      - name: '📦 Setup pnpm'
        uses: pnpm/action-setup@v6.1.0

      - name: '☕ Setup Node'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: '📦 Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: '🔍 Lint'
        run: pnpm lint

  type-check:
    name: '🔎 Type check'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@v7.0.1

      - name: '📦 Setup pnpm'
        uses: pnpm/action-setup@v6.1.0

      - name: '☕ Setup Node'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: '📦 Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: '🔎 Type check'
        run: pnpm type-check

  test:
    name: '🧪 Test'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@v7.0.1

      - name: '📦 Setup pnpm'
        uses: pnpm/action-setup@v6.1.0

      - name: '☕ Setup Node'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: '📦 Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: '🧪 Run tests'
        run: pnpm test -- --reporter=verbose
