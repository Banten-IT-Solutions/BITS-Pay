name: Deploy Web
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bits-pay/web build
      - run: pnpm --filter @bits-pay/user build
      - run: pnpm --filter @bits-pay/admin build
      # ponytail: copy SPAs into web/dist for combined serving.
      # When traffic grows, split into separate workers.
      - run: |
          cp -r packages/user/dist packages/web/dist/user
          cp -r packages/admin/dist packages/web/dist/admin
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: deploy
          workingDirectory: packages/web
