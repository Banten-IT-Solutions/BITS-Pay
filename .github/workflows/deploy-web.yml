name: Deploy Web
on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - 'packages/user/**'
      - 'packages/admin/**'
      - 'packages/web/wrangler.jsonc'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run build -w packages/web
      - run: npm run build -w packages/user
      - run: npm run build -w packages/admin
      # ponytail: copy SPAs into web/dist for combined serving.
      # When traffic grows, split into separate workers.
      - run: |
          cp -r packages/user/dist packages/web/dist/user
          cp -r packages/admin/dist packages/web/dist/admin
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: deploy
          workingDirectory: packages/web
