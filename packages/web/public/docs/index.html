<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BITS Pay API — Dokumentasi</title>
    <meta
      name="description"
      content="Dokumentasi API BITS Pay — QRIS payment gateway. Create charge, cek status, konfirmasi pembayaran."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/common.css" />
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          const s = localStorage.getItem('bits-theme');
          const d =
            s === 'dark' || (!s && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
        function toggleTheme() {
          const h = document.documentElement;
          const n = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          h.setAttribute('data-theme', n);
          try {
            localStorage.setItem('bits-theme', n);
          } catch (e) {}
        }
        window.toggleTheme = toggleTheme;
      })();
    </script>
    <style>
      .swagger-ui .topbar {
        display: none;
      }
      .swagger-ui {
        color: var(--text-body);
      }
      .swagger-ui .info .title {
        font-family: var(--font-sans);
      }
      #swagger-ui {
        max-width: 1080px;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <div class="nav-row">
          <a href="/" class="nav-logo">BITS Pay</a>
          <div class="nav-links">
            <a href="/docs/" class="active">API Docs</a>
            <a href="/docs/guides/quickstart.html">Quickstart</a>
            <a href="/docs/guides/webhook.html">Webhook</a>
            <a href="/privacy">Kebijakan Privasi</a>
            <button
              class="theme-switch"
              onclick="toggleTheme()"
              aria-label="Ganti tema terang/gelap"
              title="Ganti tema"
            >
              <svg
                class="icon-sun"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                />
              </svg>
              <svg
                class="icon-moon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
    <script>
      window.onload = () => {
        window.ui = SwaggerUIBundle({
          url: '/docs/openapi.json',
          dom_id: '#swagger-ui',
          deepLinking: true,
          persistAuthorization: true,
          displayRequestDuration: true,
          tryItOutEnabled: true,
        });
      };
    </script>
  </body>
</html>
