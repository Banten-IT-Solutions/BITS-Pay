<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BITS Pay Status</title>
    <meta name="description" content="Status layanan BITS Pay API." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/common.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Theme init — sebelum paint, cegah flash. Prioritas: localStorage > system.
      (function () {
        try {
          const s = localStorage.getItem('bits-theme');
          const d =
            s === 'dark' || (!s && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
        function toggleTheme() {
          const h = document.documentElement;
          const n = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          h.setAttribute('data-theme', n);
          try {
            localStorage.setItem('bits-theme', n);
          } catch (e) {}
        }
        window.toggleTheme = toggleTheme;
      })();
    </script>
  </head>
  <body>
    <nav class="navbar">
      <div class="container nav-container">
        <a href="/" class="nav-logo"
          ><svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5.5" stroke="#e0272f" stroke-width="3.5" />
            <rect x="8" y="8" width="8" height="8" rx="2" fill="#e0272f" /></svg
          >BITS Pay</a
        >
        <div id="nav-menu" class="nav-menu">
          <div class="nav-links">
            <a href="/#cara-kerja" class="nav-link">Cara Kerja</a>
            <a href="/#fitur" class="nav-link">Fitur</a>
            <a href="/#harga" class="nav-link">Harga</a>
            <a href="/docs/" class="nav-link">Docs</a>
          </div>
        </div>
        <div class="nav-end">
          <button
            class="theme-switch"
            onclick="toggleTheme()"
            aria-label="Ganti tema terang/gelap"
            title="Ganti tema"
          >
            <svg
              class="icon-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
            <svg
              class="icon-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
          <button
            id="nav-toggle"
            class="nav-toggle"
            aria-label="Toggle menu"
            aria-expanded="false"
            aria-controls="nav-menu"
          >
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </nav>

    <main class="status-wrap">
      <div class="status-card">
        <h1>BITS Pay Status</h1>
        <p class="status-sub" id="sub">Memeriksa API&hellip;</p>
        <span class="status-badge checking" id="badge">
          <span class="dot"></span><span id="label">Checking</span>
        </span>
        <p class="status-hint">api.pay.bits.co.id</p>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <div class="footer-brand">
          <strong
            ><svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect
                x="2"
                y="2"
                width="20"
                height="20"
                rx="5.5"
                stroke="#e0272f"
                stroke-width="3.5"
              />
              <rect x="8" y="8" width="8" height="8" rx="2" fill="#e0272f" /></svg
            >BITS Pay</strong
          >
          <p>QRIS payment gateway untuk aplikasi kamu.</p>
        </div>
        <nav class="footer-nav" aria-label="Navigasi footer">
          <a href="/#cara-kerja">Cara Kerja</a>
          <a href="/#fitur">Fitur</a>
          <a href="/#harga">Harga</a>
          <a href="/docs/">Dokumentasi</a>
          <a href="mailto:admin@bits.co.id">Kontak</a>
          <a href="/privacy">Privasi</a>
          <a href="/terms">Syarat</a>
        </nav>
      </div>
      <div class="container footer-bottom">
        <p class="footer-copyright">
          &copy; 2026 BITS Pay &mdash; Developed with
          <span class="heart">&#10084;&#xFE0E;</span> by
          <a class="footer-co" href="https://bits.co.id">Banten IT Solutions</a>
        </p>
      </div>
    </footer>

    <script>
      // Health check API — logic tidak berubah, hanya class badge baru.
      (async () => {
        const sub = document.getElementById('sub');
        const badge = document.getElementById('badge');
        const label = document.getElementById('label');
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 5000);
        try {
          const res = await fetch('https://api.pay.bits.co.id/health', { signal: ctrl.signal });
          const json = await res.json();
          const ok =
            res.ok && json && json.success === true && json.data && json.data.status === 'ok';
          if (ok) {
            badge.className = 'status-badge ok';
            label.textContent = 'API online';
            sub.textContent = 'Semua sistem beroperasi normal';
          } else {
            badge.className = 'status-badge bad';
            label.textContent = 'API degraded';
            sub.textContent = 'Respons tidak sesuai ekspektasi';
          }
        } catch (e) {
          badge.className = 'status-badge bad';
          label.textContent = 'API degraded';
          sub.textContent =
            e.name === 'AbortError' ? 'Timeout terhubung ke API' : 'Tidak dapat terhubung ke API';
        } finally {
          clearTimeout(timer);
        }
      })();
    </script>
    <script>
      // Nav mobile toggle + elevasi pill saat scroll (main.ts tidak dimuat di halaman statis).
      (function () {
        var toggle = document.getElementById('nav-toggle');
        var menu = document.getElementById('nav-menu');
        if (toggle && menu) {
          toggle.addEventListener('click', function () {
            var open = menu.classList.toggle('open');
            toggle.setAttribute('aria-expanded', String(open));
          });
          menu.querySelectorAll('a').forEach(function (a) {
            a.addEventListener('click', function () {
              menu.classList.remove('open');
              toggle.setAttribute('aria-expanded', 'false');
            });
          });
        }
        var nav = document.querySelector('.navbar');
        if (nav) {
          var onScroll = function () {
            nav.classList.toggle('scrolled', window.scrollY > 8);
          };
          window.addEventListener('scroll', onScroll, { passive: true });
          onScroll();
        }
      })();
    </script>
  </body>
</html>
